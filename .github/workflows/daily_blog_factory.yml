name: Daily Blog Content Factory

on:
  schedule:
    - cron: '0 9 * * *' # Run daily at 09:00 UTC (11:00 AM Amsterdam time)
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate Daily Blog Posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate_daily_posts.js

      - name: Verify Build Compilation
        run: |
          npm ci
          npm run build

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/blogPosts.js src/data/blogPostsNl.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(blog): automatically generate daily blog posts via Content Factory"
            git push origin main
          else
            echo "No changes to commit"
          fi
